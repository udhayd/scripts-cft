AWSTemplateFormatVersion: 2010-09-09
Description: OKD Cluster Config Creation

Parameters:
  ImageId:
    Description: "AMI Id"
    Type: String
  STK:
    Description: "Name of stack"
    Type: String
  CRED1:
    Description: "Credentials"
    Type: String
  CRED2:
    Description: "Credentials"
    Type: String
  HOSTZONE:
    Description: "Hosted Zone"
    Type: String
  IgnitionBucket:
    Type: String
    Description: S3 bucket containing ignition files
    Default: "openshift-install-test"

Mappings: 
  MInstanceMap: 
    Instancetype: 
      dev: "t2.medium"
      test: "t2.micro"
      uat: "t2.medium"
      prod: "t2.large"

Resources:
  Installnode:
    DependsOn: MyBucket
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile:
        Ref: InstanceProfile
      ImageId:
        Ref: ImageId
      InstanceType: !FindInMap [MInstanceMap, Instancetype, test]
      SecurityGroupIds:
        - Ref: LBSecurityGroup
      SubnetId:
        Fn::ImportValue: PublicSubnet1ID
      Tags:
        - Key: Name
          Value: !Sub openshift-install-${STK}
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -x
            exec >/root/bootstrap.log 2>&1
            cd /root
            hostname openshift-install
            echo openshift-install  >/etc/hostname
            cat >>/root/.bash_profile <<EOF
            alias c=clear
            alias kc=kubectl
            set -o vi
            export PS1=\$(hostname):'\$PWD# '
            EOF
            source /root/.bash_profile
            AZ=$(curl http://169.254.169.254/latest/meta-data/placement/availability-zone 2>/dev/null)
            OKD="https://github.com/okd-project/okd/releases/download/5.0.0-okd-scos.ec.3/openshift-install-linux-5.0.0-okd-scos.ec.3.tar.gz"
            OC="https://mirror.openshift.com/pub/openshift-v4/clients/oc/latest/linux/oc.tar.gz"
            export AWS_DEFAULT_REGION=$(echo $AZ| sed 's/.$//g')
            ssh-keygen -t rsa -f /root/.ssh/id_rsa -q -P ""
            cp /root/.ssh/id_rsa.pub /root/.ssh/authorized_keys
            dnf install -y https://s3.amazonaws.com/ec2-downloads-windows/SSMAgent/latest/linux_amd64/amazon-ssm-agent.rpm
            yum install -y unzip groff
            systemctl enable amazon-ssm-agent && systemctl start amazon-ssm-agent
            systemctl status amazon-ssm-agent
            curl https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
            unzip awscliv2.zip
            sudo ./aws/install && rm -rf aws* README*
            curl -OL $OKD
            tar -xzvf openshift-install-linux*.tar.gz;mv openshift-install /usr/local/bin/
            curl -OL $OC
            tar -xzvf oc*.tar.gz;mv oc /usr/local/bin;mv kubectl /usr/local/bin
            #USER=openshift
            #CREDS=$(aws iam create-access-key --user-name $USER --output text)
            #CREDS1=(echo $CREDS)
            export AWS_ACCESS_KEY_ID="${CRED1}"
            export AWS_SECRET_ACCESS_KEY="${CRED2}"
            export AWS_REGION=$AWS_DEFAULT_REGION
            cat >/root/install-config.yaml <<EOF
            additionalTrustBundlePolicy: Proxyonly
            apiVersion: v1
            baseDomain: groofy.xyz
            compute:
            - architecture: amd64
              hyperthreading: Enabled
              name: worker
              platform: {}
              replicas: 1
            controlPlane:
              architecture: amd64
              hyperthreading: Enabled
              name: master
              platform: {}
              replicas: 3
            metadata:
              name: test
            networking:
              clusterNetwork:
              - cidr: 10.128.0.0/14
                hostPrefix: 23
              machineNetwork:
              - cidr: 10.0.0.0/16
              networkType: OVNKubernetes
              serviceNetwork:
              - 172.30.0.0/16
            platform:
              aws:
                region: us-east-1
                vpc: {}
            publish: External
            pullSecret: '{"auths":{"cloud.openshift.com":{"auth":"b3BlbnNoaWZ0LXJlbGVhc2UtZGV2K29jbV9hY2Nlc3NfNTU0NGFiZTZkM2RmNDQ2OGE0MWQxM2YxMTAxMmM1NmM6S1dZUjhSVTlaRVoyRTExQkJTTTgxMDJRUVFHSjdRREpJWFM3WTc3VVE0UEhKWDhVN0ZRSUJCSDI2UlM3MzhaTw==","email":"d.udhayashankar@gmail.com"},"quay.io":{"auth":"b3BlbnNoaWZ0LXJlbGVhc2UtZGV2K29jbV9hY2Nlc3NfNTU0NGFiZTZkM2RmNDQ2OGE0MWQxM2YxMTAxMmM1NmM6S1dZUjhSVTlaRVoyRTExQkJTTTgxMDJRUVFHSjdRREpJWFM3WTc3VVE0UEhKWDhVN0ZRSUJCSDI2UlM3MzhaTw==","email":"d.udhayashankar@gmail.com"},"registry.connect.redhat.com":{"auth":"","email":"d.udhayashankar@gmail.com"},"registry.redhat.io":{"auth":"","email":"d.udhayashankar@gmail.com"}}}'
            sshKey: |
              $(cat /root/.ssh/id_rsa.pub)
            EOF
            mkdir /root/test;cp /root/install-config.yaml /root/test
            #aws sts assume-role --role-arn "arn:aws:iam::'${AWS::AccountId}':role/'${AWS::StackName}'-role" --role-session-name AWSCLI-Session 
            openshift-install create manifests --dir=/root/test
            openshift-install create ignition-configs --dir=/root/test
            cd /root/test
            for i in $(ls -1 *.ign)
            do
            aws s3 cp $i s3://${IgnitionBucket}/$i
            done
            echo "********END TASK******************"
            

  LBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName:
        Fn::Sub: "${AWS::StackName}-SG"
      GroupDescription:
        Fn::Sub: "${AWS::StackName} SG"
      VpcId:
        Fn::ImportValue: MyVPCID
      SecurityGroupIngress:
      - IpProtocol: TCP
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
        Description: "To Access Application in K8s cluster"
      - IpProtocol: TCP
        FromPort: 6443
        ToPort: 6443  
        CidrIp: 0.0.0.0/0
        Description: "To Access Kubeapi Server"

  HostedZone:
    Type: "AWS::Route53::HostedZone"
    Properties:
      HostedZoneConfig:
        Comment: 'My hosted zone for okd'
      Name: !Sub "${HOSTZONE}"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-role"
      Roles:
        - Ref: InstanceRole

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "IAM role to connect to EC2 Instance"
      RoleName: !Sub "${AWS::StackName}-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AdministratorAccess

  MyBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub "${IgnitionBucket}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
          
  MyBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket:
        Ref: 'MyBucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource:
              Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - Ref: 'MyBucket'
                  - '/*'

Outputs:
  HOSTEDZONE:
    Description: "Hosted Zone ID"
    Export:
      Name: 'HOSTEDZONE'
    Value: !Ref 'HostedZone'

